name: Verify OpenCode generation
on:
  push:
    branches: [verify/opencode-model]
    paths: [.github/workflows/verify-opencode.yml]
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - name: Verify real model and validated output
        env:
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
        shell: bash
        run: |
          if [[ -z "${MODEL_API_KEY//[[:space:]]/}" ]]; then
            echo "::error::Repository secret MODEL_API_KEY is missing"
            exit 1
          fi
          if [[ "$MODEL_NAME" != "deepseek-v4.1-flash" || ! "${MODEL_BASE_URL%/}" =~ ^https://opencode\.ai/inference/(go/)?openai/v1$ ]]; then
            echo "::error::MODEL_NAME or MODEL_BASE_URL differs from the agreed OpenCode configuration"
            exit 1
          fi
          sample="$(mktemp -d)"
          target="$(node --input-type=module -e 'import { isWeekend, shanghaiDate, shiftDate } from "./build/contract.js"; let date = shanghaiDate(); while (isWeekend(date)) date = shiftDate(date, 1); console.log(date)')"
          cat > "$sample/model-trace.mjs" <<'JS'
          import { randomUUID } from 'node:crypto';
          const sessionId = randomUUID();
          const upstream = globalThis.fetch;
          globalThis.fetch = async (url, options) => {
            if (!/^https:\/\/opencode\.ai\/inference\/(?:go\/)?openai\/v1\/chat\/completions$/.test(String(url))) {
              return upstream(url, options);
            }
            const start = Date.now();
            try {
              const headers = new Headers(options?.headers);
              headers.set('User-Agent', 'daily-haiku/0.1.0');
              if (String(url).includes('/go/')) headers.set('x-opencode-session', sessionId);
              const response = await upstream(url, { ...options, headers, signal: AbortSignal.timeout(45_000) });
              console.log(`::notice::OpenCode HTTP ${response.status} after ${Date.now() - start} ms`);
              if (!response.ok) {
                const result = await response.clone().json().catch(() => null);
                const fields = [result?.error?.code, result?.error?.type, result?.error?.message, result?.error, result?.message];
                const description = fields.filter(value => typeof value === 'string').join(' ').toLowerCase();
                const route = String(url).includes('/go/') ? 'Go' : 'Console';
                const classes = [
                  ['balance or quota', /insufficient|balance|payment|billing|credits|quota/],
                  ['subscription', /subscription|plan|subscriber/],
                  ['model', /model|upstream|provider/],
                  ['request fields', /invalid|parameter|required|messages|unsupported|request|format/],
                  ['authorization', /unauthorized|forbidden|permission|api key|credential/],
                  ['region', /region|country|location/]
                ];
                const keywords = ['session','header','coding','agent','harness','user-agent','global','privacy','provider','region','unsupported','invalid','message','stream','thinking','plan','model','allow','blocked','missing','must','only','unsupported','supported','reasoning','content','request','opencode','go','subscription','external','contact','access','client','id','x-opencode-session','attribution','eligible','parameter','balance','country','service','input','authentication','signature','usage','native','identify'];
                const words = description.match(/[a-z]+(?:-[a-z]+)*/g) || [];
                const safeTerms = [...new Set(words.filter(word => keywords.includes(word)))];
                console.log(`::notice::OpenCode error terms: ${safeTerms.join(' ')}`);
                const matches = classes.filter(([, expression]) => expression.test(description)).map(([label]) => label);
                const params = ['model','messages','temperature','max_tokens','max_completion_tokens','response_format','stream','thinking','reasoning_effort'];
                const param = params.includes(result?.error?.param) ? result.error.param : 'not specified';
                console.log(`::notice::OpenCode ${route} error classification: ${matches.join(', ') || 'unspecified'}; parameter: ${param}`);
              }
              if (response.ok) {
                const data = await response.clone().json().catch(() => null);
                const content = data?.choices?.[0]?.message?.content;
                let format = 'empty or non-text message';
                if (typeof content === 'string' && content.trim()) {
                  try {
                    const body = JSON.parse(content);
                    format = ['ja','zh','en'].every(key => Array.isArray(body?.[key]) && body[key].length === 3)
                      ? 'three language arrays' : 'unexpected JSON fields';
                  } catch {
                    format = content.trim().startsWith('```') ? 'Markdown-fenced JSON or text' : 'non-JSON text';
                  }
                }
                console.log(`::notice::OpenCode response shape: ${format}`);
              }
              return response;
            } catch (error) {
              const cause = ['TimeoutError', 'AbortError', 'TypeError'].includes(error?.name) ? error.name : 'transport error';
              console.log(`::warning::OpenCode transport: ${cause} after ${Date.now() - start} ms`);
              throw error;
            }
          };
          JS
          node --import "$sample/model-trace.mjs" build/generator/cli.js --date "$target" --out "$sample"
          node --input-type=module - "$sample/api/v1/custom/$target.json" <<'JS'
          import { readFile } from 'node:fs/promises';
          import { validateEntry } from './build/contract.js';
          const entry = validateEntry(JSON.parse(await readFile(process.argv[2], 'utf8')), 'custom');
          if (entry.source !== 'model') {
            console.error('::error::Generation used the backup catalog');
            process.exitCode = 1;
          } else {
            console.log('OpenCode returned a valid, model-generated three-language haiku.');
          }
          JS
